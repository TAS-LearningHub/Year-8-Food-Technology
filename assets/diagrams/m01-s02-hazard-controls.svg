<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Spot the hazard, then choose a control</title><desc id="desc">A central pause-and-assess step links four kitchen hazards to matching controls for slips, burns, cuts and collisions.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9493e"/></marker></defs>
  <rect width="1200" height="750" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="16" fill="#c9493e"/>
  <text x="70" y="72" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#243229"><tspan x="70" dy="0">Spot the hazard, then choose a control</tspan></text>
  <text x="70" y="124" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Safe routines depend on noticing what could cause harm before beginning work.</tspan></text>
  <line x1="70" y1="160" x2="1130" y2="160" stroke="#cbd8cd" stroke-width="2"/><line x1="600" y1="445" x2="600" y2="230" stroke="#c9493e" stroke-width="4" opacity="0.65"/><line x1="600" y1="445" x2="815" y2="445" stroke="#c9493e" stroke-width="4" opacity="0.65"/><line x1="600" y1="445" x2="600" y2="660" stroke="#c9493e" stroke-width="4" opacity="0.65"/><line x1="600" y1="445" x2="385" y2="445" stroke="#c9493e" stroke-width="4" opacity="0.65"/><circle cx="600" cy="445" r="100" fill="#c9493e"/><text x="600" y="435" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#ffffff"><tspan x="600" dy="0">Pause and</tspan><tspan x="600" dy="29.5">assess</tspan></text><rect x="488" y="182" width="224" height="96" rx="18" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="600" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243229"><tspan x="600" dy="0">Slip or trip → clear and</tspan><tspan x="600" dy="20.06">dry the path</tspan></text><rect x="703" y="397" width="224" height="96" rx="18" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="815" y="435" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243229"><tspan x="815" dy="0">Burn or scald → control</tspan><tspan x="815" dy="20.06">heat and handles</tspan></text><rect x="488" y="612" width="224" height="96" rx="18" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="600" y="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243229"><tspan x="600" dy="0">Cut → select and place</tspan><tspan x="600" dy="20.06">tools safely</tspan></text><rect x="273" y="397" width="224" height="96" rx="18" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="385" y="435" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243229"><tspan x="385" dy="0">Collision → communicate</tspan><tspan x="385" dy="20.06">and share space</tspan></text>
  <text x="70" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5d6d63">YEAR 8 FOOD TECHNOLOGY · LEARNING VISUAL</text>
  <text x="1130" y="708" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5d6d63">m01-s02-hazard-controls</text>
