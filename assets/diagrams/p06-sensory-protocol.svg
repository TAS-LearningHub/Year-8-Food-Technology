<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Run a fair sensory comparison</title><desc id="desc">Six-stage fair sensory protocol covering safety, equal coded samples, consistent conditions, descriptors, palate cleansing and recording.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23664b"/></marker></defs>
  <rect width="1200" height="750" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="16" fill="#23664b"/>
  <text x="70" y="72" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#243229"><tspan x="70" dy="0">Run a fair sensory comparison</tspan></text>
  <text x="70" y="124" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Keep the testing conditions consistent and record observations before discussion</tspan><tspan x="70" dy="25.959999999999997">changes your judgement.</tspan></text>
  <line x1="70" y1="160" x2="1130" y2="160" stroke="#cbd8cd" stroke-width="2"/><line x1="233.66666666666666" y1="340" x2="246.66666666666666" y2="340" stroke="#23664b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="260" width="161.66666666666666" height="245" rx="18" fill="#ffffff" stroke="#23664b" stroke-width="3"/><circle cx="150.83333333333331" cy="316" r="30" fill="#23664b"/><text x="150.83333333333331" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#ffffff"><tspan x="150.83333333333331" dy="0">1</tspan></text><text x="150.83333333333331" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="650" fill="#243229"><tspan x="150.83333333333331" dy="0">Confirm food is</tspan><tspan x="150.83333333333331" dy="23.599999999999998">safe to sample</tspan></text><line x1="413.3333333333333" y1="340" x2="426.3333333333333" y2="340" stroke="#23664b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="249.66666666666666" y="260" width="161.66666666666666" height="245" rx="18" fill="#ffffff" stroke="#23664b" stroke-width="3"/><circle cx="330.5" cy="316" r="30" fill="#23664b"/><text x="330.5" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#ffffff"><tspan x="330.5" dy="0">2</tspan></text><text x="330.5" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="650" fill="#243229"><tspan x="330.5" dy="0">Prepare equal,</tspan><tspan x="330.5" dy="23.599999999999998">coded samples</tspan></text><line x1="593" y1="340" x2="606" y2="340" stroke="#23664b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="429.3333333333333" y="260" width="161.66666666666666" height="245" rx="18" fill="#ffffff" stroke="#23664b" stroke-width="3"/><circle cx="510.16666666666663" cy="316" r="30" fill="#23664b"/><text x="510.16666666666663" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#ffffff"><tspan x="510.16666666666663" dy="0">3</tspan></text><text x="510.16666666666663" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="650" fill="#243229"><tspan x="510.16666666666663" dy="0">Use the same</tspan><tspan x="510.16666666666663" dy="23.599999999999998">order and</tspan><tspan x="510.16666666666663" dy="23.599999999999998">conditions</tspan></text><line x1="772.6666666666666" y1="340" x2="785.6666666666666" y2="340" stroke="#23664b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="609" y="260" width="161.66666666666666" height="245" rx="18" fill="#ffffff" stroke="#23664b" stroke-width="3"/><circle cx="689.8333333333334" cy="316" r="30" fill="#23664b"/><text x="689.8333333333334" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#ffffff"><tspan x="689.8333333333334" dy="0">4</tspan></text><text x="689.8333333333334" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="650" fill="#243229"><tspan x="689.8333333333334" dy="0">Observe with</tspan><tspan x="689.8333333333334" dy="23.599999999999998">agreed</tspan><tspan x="689.8333333333334" dy="23.599999999999998">descriptors</tspan></text><line x1="952.3333333333333" y1="340" x2="965.3333333333333" y2="340" stroke="#23664b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="788.6666666666666" y="260" width="161.66666666666666" height="245" rx="18" fill="#ffffff" stroke="#23664b" stroke-width="3"/><circle cx="869.5" cy="316" r="30" fill="#23664b"/><text x="869.5" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#ffffff"><tspan x="869.5" dy="0">5</tspan></text><text x="869.5" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="650" fill="#243229"><tspan x="869.5" dy="0">Cleanse the</tspan><tspan x="869.5" dy="23.599999999999998">palate as</tspan><tspan x="869.5" dy="23.599999999999998">directed</tspan></text><rect x="968.3333333333333" y="260" width="161.66666666666666" height="245" rx="18" fill="#ffffff" stroke="#23664b" stroke-width="3"/><circle cx="1049.1666666666665" cy="316" r="30" fill="#23664b"/><text x="1049.1666666666665" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#ffffff"><tspan x="1049.1666666666665" dy="0">6</tspan></text><text x="1049.1666666666665" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="650" fill="#243229"><tspan x="1049.1666666666665" dy="0">Record, then</tspan><tspan x="1049.1666666666665" dy="23.599999999999998">compare evidence</tspan></text>
  <text x="70" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5d6d63">YEAR 8 FOOD TECHNOLOGY · LEARNING VISUAL</text>
