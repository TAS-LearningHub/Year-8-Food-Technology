  <text x="70" y="124" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Name the feature, describe its intensity or quality, then support the comparison.</tspan></text>
