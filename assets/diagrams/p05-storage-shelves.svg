<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Store food to prevent drips and unintended contact</title><desc id="desc">Refrigerator shelf diagram with covered ready-to-eat food above, prepared items in the middle and sealed raw meat or poultry on the lowest shelf.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e6ae35"/></marker></defs>
  <rect width="1200" height="750" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="16" fill="#e6ae35"/>
  <text x="70" y="60" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#243229"><tspan x="70" dy="0">Store food to prevent drips and unintended</tspan><tspan x="70" dy="35.7">contact</tspan></text>
  <text x="70" y="134" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Cover food, separate raw items and keep raw meat or poultry on the lowest suitable</tspan><tspan x="70" dy="25.959999999999997">shelf.</tspan></text>
  <line x1="70" y1="170" x2="1130" y2="170" stroke="#cbd8cd" stroke-width="2"/><rect x="205" y="205" width="790" height="390" rx="30" fill="#ffffff" stroke="#e6ae35" stroke-width="7"/><circle cx="270" cy="253.75" r="24" fill="#23664b"/><text x="320" y="261.75" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#243229"><tspan x="320" dy="0">Upper: covered ready-to-eat food</tspan></text><line x1="225" y1="302.5" x2="975" y2="302.5" stroke="#cbd8cd" stroke-width="5"/><circle cx="270" cy="351.25" r="24" fill="#c9493e"/><text x="320" y="359.25" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#243229"><tspan x="320" dy="0">Middle: covered dairy and prepared ingredients</tspan></text><line x1="225" y1="400" x2="975" y2="400" stroke="#cbd8cd" stroke-width="5"/><circle cx="270" cy="448.75" r="24" fill="#8d395e"/><text x="320" y="456.75" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#243229"><tspan x="320" dy="0">Lower: sealed raw meat or poultry tray</tspan></text><line x1="225" y1="497.5" x2="975" y2="497.5" stroke="#cbd8cd" stroke-width="5"/><circle cx="270" cy="546.25" r="24" fill="#3578a8"/><text x="320" y="554.25" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#243229"><tspan x="320" dy="0">All shelves: labels and school storage directions checked</tspan></text>
  <text x="70" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5d6d63">YEAR 8 FOOD TECHNOLOGY · LEARNING VISUAL</text>
  <text x="1130" y="708" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5d6d63">p05-storage-shelves</text>
