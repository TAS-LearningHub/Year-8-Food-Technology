<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Mise en place gives every item a safe job</title><desc id="desc">Four-zone mise en place map for clean preparation, measured ingredients, used tools or waste, and heat or finished food.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9493e"/></marker></defs>
  <rect width="1200" height="750" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="16" fill="#c9493e"/>
  <text x="70" y="72" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#243229"><tspan x="70" dy="0">Mise en place gives every item a safe job</tspan></text>
  <text x="70" y="124" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Organise ingredients, equipment, waste and clean space before the method speeds up.</tspan></text>
  <line x1="70" y1="160" x2="1130" y2="160" stroke="#cbd8cd" stroke-width="2"/><rect x="90" y="225" width="490" height="160" rx="22" fill="#dceee2" stroke="#23664b" stroke-width="3"/><text x="118" y="275" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#23664b"><tspan x="118" dy="0">Clean preparation zone</tspan></text><text x="118" y="325" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="118" dy="0">board, bowl and current tools</tspan></text><rect x="620" y="225" width="490" height="160" rx="22" fill="#ffffff" stroke="#c9493e" stroke-width="3"/><text x="648" y="275" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#c9493e"><tspan x="648" dy="0">Measured ingredient zone</tspan></text><text x="648" y="325" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="648" dy="0">checked quantities in order of use</tspan></text><rect x="90" y="430" width="490" height="160" rx="22" fill="#dceee2" stroke="#8d395e" stroke-width="3"/><text x="118" y="480" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#8d395e"><tspan x="118" dy="0">Waste and used-tool zone</tspan></text><text x="118" y="530" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="118" dy="0">kept separate from clean items</tspan></text><rect x="620" y="430" width="490" height="160" rx="22" fill="#ffffff" stroke="#3578a8" stroke-width="3"/><text x="648" y="480" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#3578a8"><tspan x="648" dy="0">Heat and finished-food zone</tspan></text><text x="648" y="530" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="648" dy="0">teacher-directed and protected</tspan></text>
  <text x="70" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5d6d63">YEAR 8 FOOD TECHNOLOGY · LEARNING VISUAL</text>
  <text x="1130" y="708" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5d6d63">p02-mise-en-place</text>
