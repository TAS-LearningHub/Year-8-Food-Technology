<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Compare menu ideas against the same questions</title><desc id="desc">Menu comparison matrix covering users, practicality, cost, variety and safe service.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8d395e"/></marker></defs>
  <rect width="1200" height="750" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="16" fill="#8d395e"/>
  <text x="70" y="60" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#243229"><tspan x="70" dy="0">Compare menu ideas against the same</tspan><tspan x="70" dy="35.7">questions</tspan></text>
  <text x="70" y="134" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">A fair design decision uses consistent evidence across each option.</tspan></text>
  <line x1="70" y1="170" x2="1130" y2="170" stroke="#cbd8cd" stroke-width="2"/><rect x="100" y="205" width="1000" height="72" rx="18" fill="#8d395e"/><text x="125" y="248" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#ffffff"><tspan x="125" dy="0">Question</tspan></text><text x="475" y="248" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#ffffff"><tspan x="475" dy="0">Evidence to gather</tspan></text><rect x="100" y="277" width="1000" height="72" fill="#dceee2" stroke="#cbd8cd"/><line x1="450" y1="277" x2="450" y2="349" stroke="#cbd8cd" stroke-width="2"/><text x="124" y="319" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="750" fill="#243229"><tspan x="124" dy="0">Does it suit the users?</tspan></text><text x="474" y="319" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="474" dy="0">Requirements and likely acceptability</tspan></text><rect x="100" y="349" width="1000" height="72" fill="#ffffff" stroke="#cbd8cd"/><line x1="450" y1="349" x2="450" y2="421" stroke="#cbd8cd" stroke-width="2"/><text x="124" y="391" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="750" fill="#243229"><tspan x="124" dy="0">Is it practical?</tspan></text><text x="474" y="391" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="474" dy="0">Time, skill, equipment and quantity</tspan></text><rect x="100" y="421" width="1000" height="72" fill="#dceee2" stroke="#cbd8cd"/><line x1="450" y1="421" x2="450" y2="493" stroke="#cbd8cd" stroke-width="2"/><text x="124" y="463" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="750" fill="#243229"><tspan x="124" dy="0">Is the cost manageable?</tspan></text><text x="474" y="463" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="474" dy="0">Current ingredient quantities and prices</tspan></text><rect x="100" y="493" width="1000" height="72" fill="#ffffff" stroke="#cbd8cd"/><line x1="450" y1="493" x2="450" y2="565" stroke="#cbd8cd" stroke-width="2"/><text x="124" y="535" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="750" fill="#243229"><tspan x="124" dy="0">Is there useful variety?</tspan></text><text x="474" y="535" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="474" dy="0">Flavour, texture, colour and food-group contribution</tspan></text><rect x="100" y="565" width="1000" height="72" fill="#dceee2" stroke="#cbd8cd"/><line x1="450" y1="565" x2="450" y2="637" stroke="#cbd8cd" stroke-width="2"/><text x="124" y="607" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="750" fill="#243229"><tspan x="124" dy="0">Can it be served safely?</tspan></text><text x="474" y="607" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="474" dy="0">Storage, allergens and service plan</tspan></text>
  <text x="70" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5d6d63">YEAR 8 FOOD TECHNOLOGY · LEARNING VISUAL</text>
  <text x="1130" y="708" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5d6d63">m08-s02-menu-balance</text>
