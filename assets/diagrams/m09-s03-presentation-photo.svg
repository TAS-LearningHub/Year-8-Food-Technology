<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Presentation evidence needs food, context and clarity</title><desc id="desc">Triangle connecting product quality, serving context and evidence clarity to credible final evidence.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9493e"/></marker></defs>
  <rect width="1200" height="750" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="16" fill="#c9493e"/>
  <text x="70" y="60" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#243229"><tspan x="70" dy="0">Presentation evidence needs food, context</tspan><tspan x="70" dy="35.7">and clarity</tspan></text>
  <text x="70" y="134" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Style the product to suit its purpose, then photograph what the evidence must show.</tspan></text>
  <line x1="70" y1="170" x2="1130" y2="170" stroke="#cbd8cd" stroke-width="2"/><polygon points="600,260 330,540 870,540" fill="#dceee2" stroke="#c9493e" stroke-width="5"/><rect x="435" y="160" width="330" height="105" rx="20" fill="#ffffff" stroke="#23664b" stroke-width="3"/><text x="600" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#243229"><tspan x="600" dy="0">Product quality</tspan><tspan x="600" dy="23.599999999999998">portion, finish and</tspan><tspan x="600" dy="23.599999999999998">consistency</tspan></text><rect x="85" y="525" width="330" height="105" rx="20" fill="#ffffff" stroke="#c9493e" stroke-width="3"/><text x="250" y="563" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#243229"><tspan x="250" dy="0">Serving context</tspan><tspan x="250" dy="23.599999999999998">user, occasion and safe setup</tspan></text><rect x="785" y="525" width="330" height="105" rx="20" fill="#ffffff" stroke="#8d395e" stroke-width="3"/><text x="950" y="563" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#243229"><tspan x="950" dy="0">Evidence clarity</tspan><tspan x="950" dy="23.599999999999998">light, angle, focus and scale</tspan></text><rect x="465" y="390" width="270" height="110" rx="26" fill="#c9493e" stroke="#c9493e" stroke-width="3"/><text x="600" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff"><tspan x="600" dy="0">Credible final</tspan><tspan x="600" dy="28.32">evidence</tspan></text>
  <text x="70" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5d6d63">YEAR 8 FOOD TECHNOLOGY · LEARNING VISUAL</text>
