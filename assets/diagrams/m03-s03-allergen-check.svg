<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Allergen safety depends on checking, not guessing</title><desc id="desc">Five-stage allergen-checking process from confirming requirements and reading labels to preventing contact and stopping when uncertain.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3578a8"/></marker></defs>
  <rect width="1200" height="750" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="16" fill="#3578a8"/>
  <text x="70" y="60" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#243229"><tspan x="70" dy="0">Allergen safety depends on checking, not</tspan><tspan x="70" dy="35.7">guessing</tspan></text>
  <text x="70" y="134" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Ingredients, labels, substitutions and unintended contact all need deliberate control.</tspan></text>
  <line x1="70" y1="170" x2="1130" y2="170" stroke="#cbd8cd" stroke-width="2"/><line x1="104" y1="277" x2="104" y2="289" stroke="#3578a8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="104" cy="241" r="29" fill="#3578a8"/><text x="104" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff"><tspan x="104" dy="0">1</tspan></text><rect x="155" y="205" width="950" height="72" rx="14" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="185" y="236" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#243229"><tspan x="185" dy="0">Ask about the person&apos;s confirmed requirements</tspan></text><line x1="104" y1="365" x2="104" y2="377" stroke="#3578a8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="104" cy="329" r="29" fill="#3578a8"/><text x="104" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff"><tspan x="104" dy="0">2</tspan></text><rect x="155" y="293" width="950" height="72" rx="14" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="185" y="324" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#243229"><tspan x="185" dy="0">Read every current ingredient label</tspan></text><line x1="104" y1="453" x2="104" y2="465" stroke="#3578a8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="104" cy="417" r="29" fill="#3578a8"/><text x="104" y="426" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff"><tspan x="104" dy="0">3</tspan></text><rect x="155" y="381" width="950" height="72" rx="14" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="185" y="412" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#243229"><tspan x="185" dy="0">Check recipes, substitutions and shared equipment</tspan></text><line x1="104" y1="541" x2="104" y2="553" stroke="#3578a8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="104" cy="505" r="29" fill="#3578a8"/><text x="104" y="514" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff"><tspan x="104" dy="0">4</tspan></text><rect x="155" y="469" width="950" height="72" rx="14" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="185" y="500" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#243229"><tspan x="185" dy="0">Prevent unintended contact during preparation and service</tspan></text><circle cx="104" cy="593" r="29" fill="#3578a8"/><text x="104" y="602" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff"><tspan x="104" dy="0">5</tspan></text><rect x="155" y="557" width="950" height="72" rx="14" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="185" y="588" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#243229"><tspan x="185" dy="0">Stop and ask the teacher if any detail is uncertain</tspan></text>
  <text x="70" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5d6d63">YEAR 8 FOOD TECHNOLOGY · LEARNING VISUAL</text>
  <text x="1130" y="708" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5d6d63">m03-s03-allergen-check</text>
  </svg>