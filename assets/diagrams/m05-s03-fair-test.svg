<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">A fair food test changes one planned variable</title><desc id="desc">Fair-test matrix distinguishing independent variable, dependent observation, controlled variables, repeat or comparison and evidence-based conclusion.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e6ae35"/></marker></defs>
  <rect width="1200" height="750" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="16" fill="#e6ae35"/>
  <text x="70" y="60" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#243229"><tspan x="70" dy="0">A fair food test changes one planned</tspan><tspan x="70" dy="35.7">variable</tspan></text>
  <text x="70" y="134" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Keep other relevant conditions consistent so the result is interpretable.</tspan></text>
  <line x1="70" y1="170" x2="1130" y2="170" stroke="#cbd8cd" stroke-width="2"/><rect x="100" y="205" width="1000" height="72" rx="18" fill="#e6ae35"/><text x="125" y="248" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#ffffff"><tspan x="125" dy="0">Test part</tspan></text><text x="475" y="248" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#ffffff"><tspan x="475" dy="0">Question to ask</tspan></text><rect x="100" y="277" width="1000" height="72" fill="#dceee2" stroke="#cbd8cd"/><line x1="450" y1="277" x2="450" y2="349" stroke="#cbd8cd" stroke-width="2"/><text x="124" y="319" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="750" fill="#243229"><tspan x="124" dy="0">Independent variable</tspan></text><text x="474" y="319" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="474" dy="0">What will we deliberately change?</tspan></text><rect x="100" y="349" width="1000" height="72" fill="#ffffff" stroke="#cbd8cd"/><line x1="450" y1="349" x2="450" y2="421" stroke="#cbd8cd" stroke-width="2"/><text x="124" y="391" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="750" fill="#243229"><tspan x="124" dy="0">Dependent observation</tspan></text><text x="474" y="391" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="474" dy="0">What will we measure or describe?</tspan></text><rect x="100" y="421" width="1000" height="72" fill="#dceee2" stroke="#cbd8cd"/><line x1="450" y1="421" x2="450" y2="493" stroke="#cbd8cd" stroke-width="2"/><text x="124" y="463" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="750" fill="#243229"><tspan x="124" dy="0">Controlled variables</tspan></text><text x="474" y="463" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="474" dy="0">What must stay the same?</tspan></text><rect x="100" y="493" width="1000" height="72" fill="#ffffff" stroke="#cbd8cd"/><line x1="450" y1="493" x2="450" y2="565" stroke="#cbd8cd" stroke-width="2"/><text x="124" y="535" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="750" fill="#243229"><tspan x="124" dy="0">Repeat or compare</tspan></text><text x="474" y="535" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="474" dy="0">How will we check consistency?</tspan></text><rect x="100" y="565" width="1000" height="72" fill="#dceee2" stroke="#cbd8cd"/><line x1="450" y1="565" x2="450" y2="637" stroke="#cbd8cd" stroke-width="2"/><text x="124" y="607" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="750" fill="#243229"><tspan x="124" dy="0">Conclusion</tspan></text><text x="474" y="607" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="474" dy="0">What does the evidence support—not prove beyond the</tspan><tspan x="474" dy="23.599999999999998">test?</tspan></text>
  <text x="70" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5d6d63">YEAR 8 FOOD TECHNOLOGY · LEARNING VISUAL</text>
  <text x="1130" y="708" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5d6d63">m05-s03-fair-test</text>
  </svg>