<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Check a food-media claim before accepting it</title><desc id="desc">Five-step media-literacy flow from claim and source through evidence and context to a responsible judgement.</desc>
