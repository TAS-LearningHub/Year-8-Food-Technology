  <text x="70" y="72" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#243229"><tspan x="70" dy="0">Nutrients have different jobs in the body</tspan></text>
  <text x="70" y="124" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Food choices work best when they provide a range of nutrients rather than one</tspan><tspan x="70" dy="25.959999999999997">‘superfood’.</tspan></text>
  <line x1="70" y1="160" x2="1130" y2="160" stroke="#cbd8cd" stroke-width="2"/><line x1="600" y1="445" x2="600" y2="215" stroke="#e6ae35" stroke-width="4" opacity="0.65"/><line x1="600" y1="445" x2="799.1858428704209" y2="330" stroke="#e6ae35" stroke-width="4" opacity="0.65"/><line x1="600" y1="445" x2="799.1858428704209" y2="560" stroke="#e6ae35" stroke-width="4" opacity="0.65"/><line x1="600" y1="445" x2="600" y2="675" stroke="#e6ae35" stroke-width="4" opacity="0.65"/><line x1="600" y1="445" x2="400.81415712957914" y2="560.0000000000001" stroke="#e6ae35" stroke-width="4" opacity="0.65"/><line x1="600" y1="445" x2="400.81415712957914" y2="330" stroke="#e6ae35" stroke-width="4" opacity="0.65"/><circle cx="600" cy="445" r="100" fill="#e6ae35"/><text x="600" y="435" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#ffffff"><tspan x="600" dy="0">Varied foods</tspan></text><rect x="488" y="167" width="224" height="96" rx="18" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="600" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243229"><tspan x="600" dy="0">Carbohydrate → energy</tspan></text><rect x="687.1858428704209" y="282" width="224" height="96" rx="18" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="799.1858428704209" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243229"><tspan x="799.1858428704209" dy="0">Protein → growth and</tspan><tspan x="799.1858428704209" dy="20.06">repair</tspan></text><rect x="687.1858428704209" y="512" width="224" height="96" rx="18" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="799.1858428704209" y="550" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243229"><tspan x="799.1858428704209" dy="0">Fat → energy and cell</tspan><tspan x="799.1858428704209" dy="20.06">functions</tspan></text><rect x="488" y="627" width="224" height="96" rx="18" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="600" y="665" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243229"><tspan x="600" dy="0">Vitamins → regulate body</tspan><tspan x="600" dy="20.06">processes</tspan></text><rect x="288.81415712957914" y="512.0000000000001" width="224" height="96" rx="18" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="400.81415712957914" y="550.0000000000001" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243229"><tspan x="400.81415712957914" dy="0">Minerals → structure and</tspan><tspan x="400.81415712957914" dy="20.06">regulation</tspan></text><rect x="288.81415712957914" y="282" width="224" height="96" rx="18" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="400.81415712957914" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243229"><tspan x="400.81415712957914" dy="0">Water → transport and</tspan><tspan x="400.81415712957914" dy="20.06">temperature control</tspan></text>
