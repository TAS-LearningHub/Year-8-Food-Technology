<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">A good menu responds to a real user and context</title><desc id="desc">Party food brief hub linked to users, dietary requirements, occasion, time and equipment, budget, and serving or waste constraints.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9493e"/></marker></defs>
  <rect width="1200" height="750" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="16" fill="#c9493e"/>
  <text x="70" y="60" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#243229"><tspan x="70" dy="0">A good menu responds to a real user and</tspan><tspan x="70" dy="35.7">context</tspan></text>
  <text x="70" y="134" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Needs and constraints define the design problem; they are not obstacles added later.</tspan></text>
