<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Evaluate each criterion with evidence</title><desc id="desc">Evaluation matrix moving from criterion and evidence to judgement, reason and realistic improvement.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8d395e"/></marker></defs>
  <rect width="1200" height="750" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="16" fill="#8d395e"/>
  <text x="70" y="72" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#243229"><tspan x="70" dy="0">Evaluate each criterion with evidence</tspan></text>
  <text x="70" y="124" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">A judgement becomes credible when it refers to what was observed, measured or</tspan><tspan x="70" dy="25.959999999999997">recorded.</tspan></text>
  <line x1="70" y1="160" x2="1130" y2="160" stroke="#cbd8cd" stroke-width="2"/><rect x="100" y="205" width="1000" height="72" rx="18" fill="#8d395e"/><text x="125" y="248" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#ffffff"><tspan x="125" dy="0">Evaluation move</tspan></text><text x="475" y="248" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#ffffff"><tspan x="475" dy="0">Question</tspan></text><rect x="100" y="277" width="1000" height="72" fill="#dceee2" stroke="#cbd8cd"/><line x1="450" y1="277" x2="450" y2="349" stroke="#cbd8cd" stroke-width="2"/><text x="124" y="319" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="750" fill="#243229"><tspan x="124" dy="0">State the criterion</tspan></text><text x="474" y="319" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="474" dy="0">What exactly counted as success?</tspan></text><rect x="100" y="349" width="1000" height="72" fill="#ffffff" stroke="#cbd8cd"/><line x1="450" y1="349" x2="450" y2="421" stroke="#cbd8cd" stroke-width="2"/><text x="124" y="391" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="750" fill="#243229"><tspan x="124" dy="0">Present evidence</tspan></text><text x="474" y="391" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="474" dy="0">What result, image, observation or feedback is</tspan><tspan x="474" dy="23.599999999999998">relevant?</tspan></text><rect x="100" y="421" width="1000" height="72" fill="#dceee2" stroke="#cbd8cd"/><line x1="450" y1="421" x2="450" y2="493" stroke="#cbd8cd" stroke-width="2"/><text x="124" y="463" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="750" fill="#243229"><tspan x="124" dy="0">Make a judgement</tspan></text><text x="474" y="463" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="474" dy="0">How well was the criterion met?</tspan></text><rect x="100" y="493" width="1000" height="72" fill="#ffffff" stroke="#cbd8cd"/><line x1="450" y1="493" x2="450" y2="565" stroke="#cbd8cd" stroke-width="2"/><text x="124" y="535" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="750" fill="#243229"><tspan x="124" dy="0">Explain the reason</tspan></text><text x="474" y="535" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="474" dy="0">What caused or limited the result?</tspan></text><rect x="100" y="565" width="1000" height="72" fill="#dceee2" stroke="#cbd8cd"/><line x1="450" y1="565" x2="450" y2="637" stroke="#cbd8cd" stroke-width="2"/><text x="124" y="607" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="750" fill="#243229"><tspan x="124" dy="0">Name an improvement</tspan></text><text x="474" y="607" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="550" fill="#243229"><tspan x="474" dy="0">What realistic change follows from the evidence?</tspan></text>
  <text x="70" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5d6d63">YEAR 8 FOOD TECHNOLOGY · LEARNING VISUAL</text>
  <text x="1130" y="708" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5d6d63">m10-s01-criteria-evidence</text>
