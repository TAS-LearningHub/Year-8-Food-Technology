<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Cross-contamination needs a pathway</title><desc id="desc">Four-stage contamination pathway from source through carrier and contact to actions that break the chain.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9493e"/></marker></defs>
  <rect width="1200" height="750" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="16" fill="#c9493e"/>
  <text x="70" y="72" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#243229"><tspan x="70" dy="0">Cross-contamination needs a pathway</tspan></text>
  <text x="70" y="124" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Break the pathway between a contamination source and ready-to-eat food.</tspan></text>
  <line x1="70" y1="160" x2="1130" y2="160" stroke="#cbd8cd" stroke-width="2"/><line x1="328" y1="387.5" x2="336" y2="387.5" stroke="#c9493e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="270" width="256" height="235" rx="18" fill="#dceee2" stroke="#c9493e" stroke-width="3"/><text x="198" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#243229"><tspan x="198" dy="0">Source</tspan><tspan x="198" dy="23.599999999999998">raw food, hands or</tspan><tspan x="198" dy="23.599999999999998">dirty surface</tspan></text><line x1="596" y1="387.5" x2="604" y2="387.5" stroke="#c9493e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="338" y="270" width="256" height="235" rx="18" fill="#ffffff" stroke="#c9493e" stroke-width="3"/><text x="466" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#243229"><tspan x="466" dy="0">Carrier</tspan><tspan x="466" dy="23.599999999999998">hands, knife, board,</tspan><tspan x="466" dy="23.599999999999998">cloth or drips</tspan></text><line x1="864" y1="387.5" x2="872" y2="387.5" stroke="#c9493e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="606" y="270" width="256" height="235" rx="18" fill="#dceee2" stroke="#c9493e" stroke-width="3"/><text x="734" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#243229"><tspan x="734" dy="0">Contact</tspan><tspan x="734" dy="23.599999999999998">ready-to-eat food or</tspan><tspan x="734" dy="23.599999999999998">clean surface</tspan></text><rect x="874" y="270" width="256" height="235" rx="18" fill="#ffffff" stroke="#c9493e" stroke-width="3"/><text x="1002" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#243229"><tspan x="1002" dy="0">Break the chain</tspan><tspan x="1002" dy="23.599999999999998">separate, wash, dry</tspan><tspan x="1002" dy="23.599999999999998">and store safely</tspan></text>
  <text x="70" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5d6d63">YEAR 8 FOOD TECHNOLOGY · LEARNING VISUAL</text>
  <text x="1130" y="708" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5d6d63">m03-s01-contamination-chain</text>
  </svg>