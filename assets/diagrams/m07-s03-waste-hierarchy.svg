<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Preventing food waste protects the most value</title><desc id="desc">Five-level food-waste hierarchy from avoid and safe reuse through recycling and recovery to disposal.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23664b"/></marker></defs>
  <rect width="1200" height="750" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="16" fill="#23664b"/>
  <text x="70" y="60" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#243229"><tspan x="70" dy="0">Preventing food waste protects the most</tspan><tspan x="70" dy="35.7">value</tspan></text>
  <text x="70" y="134" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Choose the highest practical action before treating food as waste.</tspan></text>
  <line x1="70" y1="170" x2="1130" y2="170" stroke="#cbd8cd" stroke-width="2"/><path d="M 120 205 H 1080 L 1032 279 H 168 Z" fill="#23664b" opacity="0.94"/><text x="600" y="237" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="750" fill="#ffffff"><tspan x="600" dy="0">Avoid unnecessary food and overproduction</tspan></text><path d="M 185 287 H 1015 L 967 361 H 233 Z" fill="#c9493e" opacity="0.94"/><text x="600" y="319" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="750" fill="#ffffff"><tspan x="600" dy="0">Reuse edible food safely</tspan></text><path d="M 250 369 H 950 L 902 443 H 298 Z" fill="#8d395e" opacity="0.94"/><text x="600" y="401" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="750" fill="#ffffff"><tspan x="600" dy="0">Recycle organics such as compost where authorised</tspan></text><path d="M 315 451 H 885 L 837 525 H 363 Z" fill="#3578a8" opacity="0.94"/><text x="600" y="483" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="750" fill="#ffffff"><tspan x="600" dy="0">Recover resources or energy</tspan></text><path d="M 380 533 H 820 L 772 607 H 428 Z" fill="#e6ae35" opacity="0.94"/><text x="600" y="565" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="750" fill="#ffffff"><tspan x="600" dy="0">Dispose only when no safer</tspan><tspan x="600" dy="20.520000000000003">higher option applies</tspan></text>
  <text x="70" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5d6d63">YEAR 8 FOOD TECHNOLOGY · LEARNING VISUAL</text>
  <text x="1130" y="708" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5d6d63">m07-s03-waste-hierarchy</text>
