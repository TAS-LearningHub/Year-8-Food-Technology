<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Control time when food is between 5°C and 60°C</title><desc id="desc">Temperature spectrum showing cold food at 5 degrees Celsius or below, a 5 to 60 degree danger zone requiring cumulative time control, and hot food at 60 degrees or above.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8d395e"/></marker></defs>
  <rect width="1200" height="750" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="16" fill="#8d395e"/>
  <text x="70" y="60" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#243229"><tspan x="70" dy="0">Control time when food is between 5°C and</tspan><tspan x="70" dy="35.7">60°C</tspan></text>
  <text x="70" y="134" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Potentially hazardous food is safest at 5°C or colder, or 60°C or hotter.</tspan></text>
  <line x1="70" y1="170" x2="1130" y2="170" stroke="#cbd8cd" stroke-width="2"/><rect x="70" y="285" width="250" height="190" fill="#3578a8" opacity="0.92"/><text x="195" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#ffffff"><tspan x="195" dy="0">5°C or colder</tspan></text><text x="195" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#ffffff"><tspan x="195" dy="0">Keep cold</tspan></text><rect x="320" y="285" width="560" height="190" fill="#e6ae35" opacity="0.78"/><text x="600" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#243229"><tspan x="600" dy="0">Between 5°C and 60°C</tspan></text><text x="600" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#243229"><tspan x="600" dy="0">Track cumulative time</tspan></text><rect x="880" y="285" width="250" height="190" fill="#c9493e" opacity="0.92"/><text x="1005" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#ffffff"><tspan x="1005" dy="0">60°C or hotter</tspan></text><text x="1005" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#ffffff"><tspan x="1005" dy="0">Keep hot</tspan></text><text x="600" y="535" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="750" fill="#c9493e"><tspan x="600" dy="0">Cumulative time matters here</tspan></text>
  <text x="70" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5d6d63">YEAR 8 FOOD TECHNOLOGY · LEARNING VISUAL</text>
  <text x="1130" y="708" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5d6d63">m03-s02-temperature-control</text>
  </svg>