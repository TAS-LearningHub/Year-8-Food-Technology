<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Five food groups organise sources, not moral scores</title><desc id="desc">Five stacked bands naming the Australian Guide to Healthy Eating food groups.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23664b"/></marker></defs>
  <rect width="1200" height="750" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="16" fill="#23664b"/>
  <text x="70" y="60" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#243229"><tspan x="70" dy="0">Five food groups organise sources, not moral</tspan><tspan x="70" dy="35.7">scores</tspan></text>
  <text x="70" y="134" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Foods are grouped because they tend to provide similar key nutrients.</tspan></text>
  <line x1="70" y1="170" x2="1130" y2="170" stroke="#cbd8cd" stroke-width="2"/><rect x="130" y="205" width="940" height="65" rx="18" fill="#23664b"/><text x="600" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="750" fill="#ffffff"><tspan x="600" dy="0">Vegetables and legumes or beans</tspan></text><rect x="175" y="287" width="850" height="65" rx="18" fill="#459267"/><text x="600" y="327" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="750" fill="#ffffff"><tspan x="600" dy="0">Fruit</tspan></text><rect x="220" y="369" width="760" height="65" rx="18" fill="#3578a8"/><text x="600" y="409" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="750" fill="#ffffff"><tspan x="600" dy="0">Grain foods, mostly wholegrain or high fibre</tspan></text><rect x="265" y="451" width="670" height="65" rx="18" fill="#e6ae35"/><text x="600" y="491" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="750" fill="#ffffff"><tspan x="600" dy="0">Lean meats and alternatives</tspan></text><rect x="310" y="533" width="580" height="65" rx="18" fill="#8d395e"/><text x="600" y="573" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="750" fill="#ffffff"><tspan x="600" dy="0">Milk, yoghurt, cheese and alternatives</tspan></text>
  <text x="70" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5d6d63">YEAR 8 FOOD TECHNOLOGY · LEARNING VISUAL</text>
  <text x="1130" y="708" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5d6d63">m04-s02-five-groups</text>
