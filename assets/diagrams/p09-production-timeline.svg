  <text x="70" y="124" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Protect cooling, checking, presentation and clean-down time instead of leaving them to</tspan><tspan x="70" dy="25.959999999999997">the end.</tspan></text>
