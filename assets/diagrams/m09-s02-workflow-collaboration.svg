  <text x="70" y="134" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Collaborators share a result, but each action still needs a clear owner and check</tspan><tspan x="70" dy="25.959999999999997">point.</tspan></text>
