<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Choose equipment from the job it must do</title><desc id="desc">Decision diagram choosing measuring, preparation or cooking equipment according to the job, technique and quantity.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e6ae35"/></marker></defs>
  <rect width="1200" height="750" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="16" fill="#e6ae35"/>
  <text x="70" y="72" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#243229"><tspan x="70" dy="0">Choose equipment from the job it must do</tspan></text>
  <text x="70" y="124" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">The safest useful tool is the one suited to the ingredient, technique and amount.</tspan></text>
  <line x1="70" y1="160" x2="1130" y2="160" stroke="#cbd8cd" stroke-width="2"/><rect x="485" y="205" width="230" height="95" rx="24" fill="#e6ae35" stroke="#e6ae35" stroke-width="3"/><text x="600" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff"><tspan x="600" dy="0">What must change?</tspan></text><line x1="600" y1="300" x2="240" y2="348" stroke="#e6ae35" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="600" y1="300" x2="600" y2="348" stroke="#e6ae35" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="600" y1="300" x2="960" y2="348" stroke="#e6ae35" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="90" y="360" width="300" height="220" rx="20" fill="#ffffff" stroke="#e6ae35" stroke-width="3"/><text x="240" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#e6ae35"><tspan x="240" dy="0">Measure</tspan></text><text x="114" y="465" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#243229"><tspan x="114" dy="0">• volume → jug or spoons</tspan></text><text x="114" y="529" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#243229"><tspan x="114" dy="0">• mass → scales</tspan></text><rect x="450" y="360" width="300" height="220" rx="20" fill="#ffffff" stroke="#e6ae35" stroke-width="3"/><text x="600" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#e6ae35"><tspan x="600" dy="0">Prepare</tspan></text><text x="474" y="465" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#243229"><tspan x="474" dy="0">• cut → suitable knife and</tspan><tspan x="474" dy="22.419999999999998">board</tspan></text><text x="474" y="529" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#243229"><tspan x="474" dy="0">• mix → bowl and utensil</tspan></text><rect x="810" y="360" width="300" height="220" rx="20" fill="#ffffff" stroke="#e6ae35" stroke-width="3"/><text x="960" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#e6ae35"><tspan x="960" dy="0">Cook</tspan></text><text x="834" y="465" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#243229"><tspan x="834" dy="0">• method → suitable pan or</tspan><tspan x="834" dy="22.419999999999998">tray</tspan></text><text x="834" y="529" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#243229"><tspan x="834" dy="0">• quantity → suitable</tspan><tspan x="834" dy="22.419999999999998">capacity</tspan></text>
  <text x="70" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5d6d63">YEAR 8 FOOD TECHNOLOGY · LEARNING VISUAL</text>
