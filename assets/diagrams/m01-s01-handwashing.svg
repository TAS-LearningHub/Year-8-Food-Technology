<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Handwashing breaks the contamination pathway</title><desc id="desc">Five-step handwashing sequence: wet, soap, rub all hand surfaces for at least 20 seconds, rinse and dry thoroughly.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23664b"/></marker></defs>
  <rect width="1200" height="750" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="16" fill="#23664b"/>
  <text x="70" y="72" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#243229"><tspan x="70" dy="0">Handwashing breaks the contamination pathway</tspan></text>
  <text x="70" y="124" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Warm water, soap, friction, rinsing and thorough drying work as one routine.</tspan></text>
  <line x1="70" y1="160" x2="1130" y2="160" stroke="#cbd8cd" stroke-width="2"/><line x1="269.6" y1="340" x2="282.6" y2="340" stroke="#23664b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="260" width="197.6" height="245" rx="18" fill="#ffffff" stroke="#23664b" stroke-width="3"/><circle cx="168.8" cy="316" r="30" fill="#23664b"/><text x="168.8" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#ffffff"><tspan x="168.8" dy="0">1</tspan></text><text x="168.8" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="650" fill="#243229"><tspan x="168.8" dy="0">Wet hands</tspan></text><line x1="485.20000000000005" y1="340" x2="498.20000000000005" y2="340" stroke="#23664b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="285.6" y="260" width="197.6" height="245" rx="18" fill="#ffffff" stroke="#23664b" stroke-width="3"/><circle cx="384.40000000000003" cy="316" r="30" fill="#23664b"/><text x="384.40000000000003" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#ffffff"><tspan x="384.40000000000003" dy="0">2</tspan></text><text x="384.40000000000003" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="650" fill="#243229"><tspan x="384.40000000000003" dy="0">Add soap</tspan></text><line x1="700.8" y1="340" x2="713.8" y2="340" stroke="#23664b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="501.2" y="260" width="197.6" height="245" rx="18" fill="#ffffff" stroke="#23664b" stroke-width="3"/><circle cx="600" cy="316" r="30" fill="#23664b"/><text x="600" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#ffffff"><tspan x="600" dy="0">3</tspan></text><text x="600" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="650" fill="#243229"><tspan x="600" dy="0">Rub every surface for</tspan><tspan x="600" dy="23.599999999999998">at least 20 seconds</tspan></text><line x1="916.4" y1="340" x2="929.4" y2="340" stroke="#23664b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="716.8" y="260" width="197.6" height="245" rx="18" fill="#ffffff" stroke="#23664b" stroke-width="3"/><circle cx="815.5999999999999" cy="316" r="30" fill="#23664b"/><text x="815.5999999999999" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#ffffff"><tspan x="815.5999999999999" dy="0">4</tspan></text><text x="815.5999999999999" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="650" fill="#243229"><tspan x="815.5999999999999" dy="0">Rinse well</tspan></text><rect x="932.4" y="260" width="197.6" height="245" rx="18" fill="#ffffff" stroke="#23664b" stroke-width="3"/><circle cx="1031.2" cy="316" r="30" fill="#23664b"/><text x="1031.2" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#ffffff"><tspan x="1031.2" dy="0">5</tspan></text><text x="1031.2" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="650" fill="#243229"><tspan x="1031.2" dy="0">Dry thoroughly</tspan></text>
  <text x="70" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5d6d63">YEAR 8 FOOD TECHNOLOGY · LEARNING VISUAL</text>
  <text x="1130" y="708" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5d6d63">m01-s01-handwashing</text>
