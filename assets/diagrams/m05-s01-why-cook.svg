rage</tspan><tspan x="1004.25" dy="22.419999999999998">Make food easier to</tspan><tspan x="1004.25" dy="22.419999999999998">serve or keep as</tspan><tspan x="1004.25" dy="22.419999999999998">authorised</tspan></text>
