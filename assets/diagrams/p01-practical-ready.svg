<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Practical-ready check</title><desc id="desc">Six-step practical readiness checklist covering personal preparation, recipe, hazards, equipment, handwashing and teacher confirmation.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23664b"/></marker></defs>
  <rect width="1200" height="750" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="16" fill="#23664b"/>
  <text x="70" y="72" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#243229"><tspan x="70" dy="0">Practical-ready check</tspan></text>
  <text x="70" y="124" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Use this before collecting ingredients or switching on equipment.</tspan></text>
  <line x1="70" y1="160" x2="1130" y2="160" stroke="#cbd8cd" stroke-width="2"/><line x1="104" y1="276.6666666666667" x2="104" y2="288.6666666666667" stroke="#23664b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="104" cy="240.83333333333334" r="29" fill="#23664b"/><text x="104" y="249.83333333333334" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff"><tspan x="104" dy="0">1</tspan></text><rect x="155" y="205" width="950" height="71.66666666666667" rx="14" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="185" y="236" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#243229"><tspan x="185" dy="0">Personal readiness: apron, hair, shoes and health check</tspan></text><line x1="104" y1="364.33333333333337" x2="104" y2="376.33333333333337" stroke="#23664b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="104" cy="328.5" r="29" fill="#23664b"/><text x="104" y="337.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff"><tspan x="104" dy="0">2</tspan></text><rect x="155" y="292.6666666666667" width="950" height="71.66666666666667" rx="14" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="185" y="323.6666666666667" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#243229"><tspan x="185" dy="0">Read the whole recipe and teacher directions</tspan></text><line x1="104" y1="452.00000000000006" x2="104" y2="464.00000000000006" stroke="#23664b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="104" cy="416.1666666666667" r="29" fill="#23664b"/><text x="104" y="425.1666666666667" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff"><tspan x="104" dy="0">3</tspan></text><rect x="155" y="380.33333333333337" width="950" height="71.66666666666667" rx="14" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="185" y="411.33333333333337" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#243229"><tspan x="185" dy="0">Identify hazards, allergens and required controls</tspan></text><line x1="104" y1="539.6666666666666" x2="104" y2="551.6666666666666" stroke="#23664b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="104" cy="503.8333333333333" r="29" fill="#23664b"/><text x="104" y="512.8333333333333" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff"><tspan x="104" dy="0">4</tspan></text><rect x="155" y="468" width="950" height="71.66666666666667" rx="14" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="185" y="499" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#243229"><tspan x="185" dy="0">Prepare clean equipment and a clear work area</tspan></text><line x1="104" y1="627.3333333333334" x2="104" y2="639.3333333333334" stroke="#23664b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="104" cy="591.5000000000001" r="29" fill="#23664b"/><text x="104" y="600.5000000000001" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff"><tspan x="104" dy="0">5</tspan></text><rect x="155" y="555.6666666666667" width="950" height="71.66666666666667" rx="14" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="185" y="586.6666666666667" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#243229"><tspan x="185" dy="0">Wash and dry hands immediately before food handling</tspan></text><circle cx="104" cy="679.1666666666667" r="29" fill="#23664b"/><text x="104" y="688.1666666666667" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff"><tspan x="104" dy="0">6</tspan></text><rect x="155" y="643.3333333333334" width="950" height="71.66666666666667" rx="14" fill="#ffffff" stroke="#cbd8cd" stroke-width="3"/><text x="185" y="674.3333333333334" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#243229"><tspan x="185" dy="0">Pause for teacher confirmation where required</tspan></text>
  <text x="70" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5d6d63">YEAR 8 FOOD TECHNOLOGY · LEARNING VISUAL</text>
