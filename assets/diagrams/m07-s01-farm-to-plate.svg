<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Food moves through a connected system</title><desc id="desc">Six-stage food-system chain from production and processing through distribution, access and use to recovery.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3578a8"/></marker></defs>
  <rect width="1200" height="750" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="16" fill="#3578a8"/>
  <text x="70" y="72" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#243229"><tspan x="70" dy="0">Food moves through a connected system</tspan></text>
  <text x="70" y="124" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Materials, people, energy, information and transport link each stage.</tspan></text>
  <line x1="70" y1="160" x2="1130" y2="160" stroke="#cbd8cd" stroke-width="2"/><line x1="238.66666666666666" y1="387.5" x2="246.66666666666666" y2="387.5" stroke="#3578a8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="270" width="166.66666666666666" height="235" rx="18" fill="#dceee2" stroke="#3578a8" stroke-width="3"/><text x="153.33333333333331" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243229"><tspan x="153.33333333333331" dy="0">Production</tspan><tspan x="153.33333333333331" dy="20.06">farm, fishery or</tspan><tspan x="153.33333333333331" dy="20.06">growing system</tspan></text><line x1="417.3333333333333" y1="387.5" x2="425.3333333333333" y2="387.5" stroke="#3578a8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="248.66666666666666" y="270" width="166.66666666666666" height="235" rx="18" fill="#ffffff" stroke="#3578a8" stroke-width="3"/><text x="332" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243229"><tspan x="332" dy="0">Processing</tspan><tspan x="332" dy="20.06">sorting,</tspan><tspan x="332" dy="20.06">changing or</tspan><tspan x="332" dy="20.06">packaging</tspan></text><line x1="596" y1="387.5" x2="604" y2="387.5" stroke="#3578a8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="427.3333333333333" y="270" width="166.66666666666666" height="235" rx="18" fill="#dceee2" stroke="#3578a8" stroke-width="3"/><text x="510.66666666666663" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243229"><tspan x="510.66666666666663" dy="0">Distribution</tspan><tspan x="510.66666666666663" dy="20.06">storage and</tspan><tspan x="510.66666666666663" dy="20.06">transport</tspan></text><line x1="774.6666666666666" y1="387.5" x2="782.6666666666666" y2="387.5" stroke="#3578a8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="606" y="270" width="166.66666666666666" height="235" rx="18" fill="#ffffff" stroke="#3578a8" stroke-width="3"/><text x="689.3333333333334" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243229"><tspan x="689.3333333333334" dy="0">Access</tspan><tspan x="689.3333333333334" dy="20.06">retail, market</tspan><tspan x="689.3333333333334" dy="20.06">or service</tspan></text><line x1="953.3333333333333" y1="387.5" x2="961.3333333333333" y2="387.5" stroke="#3578a8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="784.6666666666666" y="270" width="166.66666666666666" height="235" rx="18" fill="#dceee2" stroke="#3578a8" stroke-width="3"/><text x="868" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243229"><tspan x="868" dy="0">Use</tspan><tspan x="868" dy="20.06">selection,</tspan><tspan x="868" dy="20.06">preparation and</tspan><tspan x="868" dy="20.06">eating</tspan></text><rect x="963.3333333333333" y="270" width="166.66666666666666" height="235" rx="18" fill="#ffffff" stroke="#3578a8" stroke-width="3"/><text x="1046.6666666666665" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243229"><tspan x="1046.6666666666665" dy="0">Recovery</tspan><tspan x="1046.6666666666665" dy="20.06">avoid waste,</tspan><tspan x="1046.6666666666665" dy="20.06">reuse or recycle</tspan></text>
  <text x="70" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5d6d63">YEAR 8 FOOD TECHNOLOGY · LEARNING VISUAL</text>
