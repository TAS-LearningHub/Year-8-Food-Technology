  <text x="70" y="72" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#243229"><tspan x="70" dy="0">Three functional changes can be observed</tspan></text>
  <text x="70" y="124" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6d63"><tspan x="70" dy="0">Describe what happens before trying to explain why.</tspan></text>
  <line x1="70" y1="160" x2="1130" y2="160" stroke="#cbd8cd" stroke-width="2"/><rect x="70" y="225" width="341.3333333333333" height="330" rx="22" fill="#dceee2" stroke="#3578a8" stroke-width="3"/><rect x="70" y="225" width="341.3333333333333" height="18" rx="9" fill="#23664b"/><text x="240.66666666666666" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#243229"><tspan x="240.66666666666666" dy="0">Denaturation</tspan><tspan x="240.66666666666666" dy="25.959999999999997">Protein structure changes;</tspan><tspan x="240.66666666666666" dy="25.959999999999997">egg can set from clear to</tspan><tspan x="240.66666666666666" dy="25.959999999999997">opaque</tspan></text><rect x="429.3333333333333" y="225" width="341.3333333333333" height="330" rx="22" fill="#ffffff" stroke="#3578a8" stroke-width="3"/><rect x="429.3333333333333" y="225" width="341.3333333333333" height="18" rx="9" fill="#c9493e"/><text x="600" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#243229"><tspan x="600" dy="0">Dextrinisation</tspan><tspan x="600" dy="25.959999999999997">Dry heat breaks starch</tspan><tspan x="600" dy="25.959999999999997">into shorter chains and</tspan><tspan x="600" dy="25.959999999999997">browns the surface</tspan></text><rect x="788.6666666666666" y="225" width="341.3333333333333" height="330" rx="22" fill="#dceee2" stroke="#3578a8" stroke-width="3"/><rect x="788.6666666666666" y="225" width="341.3333333333333" height="18" rx="9" fill="#8d395e"/><text x="959.3333333333333" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#243229"><tspan x="959.3333333333333" dy="0">Emulsification</tspan><tspan x="959.3333333333333" dy="25.959999999999997">An emulsifier helps</tspan><tspan x="959.3333333333333" dy="25.959999999999997">normally separate liquids</tspan><tspan x="959.3333333333333" dy="25.959999999999997">stay dispersed</tspan></text>
